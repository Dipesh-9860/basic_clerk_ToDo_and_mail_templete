[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-todo"
version = "0.1.0"
requires-python = ">=3.10"
description = "Simple CLI to-do app"

[project.scripts]
todo = "ace_todo.app:main"
todo-gui = "ace_todo.gui:main"   # 👈 new GUI entry point

[tool.setuptools]
package-dir = {"" = "src"}          # 👈 Map packages under ./src

[tool.setuptools.packages.find]
where = ["src"]                      # 👈 Find packages in ./src
